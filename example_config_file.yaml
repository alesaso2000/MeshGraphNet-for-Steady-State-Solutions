edge_features:
- distance_vector
- distance_magnitude
model:
  embedding_dim: 128
  encoder_mlp_hidden_dim: 128
  n_decoder_mlp_hidden_layers: 3
  n_encoder_mlp_hidden_layers: 2
  n_message_passing_layers: 15
  n_processor_mlp_hidden_layers: 2
node_features:
- node_type_one_hot
- distance_from_obj_vec
- distance_from_obj_mag
- potential_solution
run: basic_lr-3
target_fields:
- velocity_mean
- pressure_mean
training_dynamics:
  batch_size: 16
  lr: 0.001
  n_epochs: 800
  device: most_free